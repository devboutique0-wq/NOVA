name: Add Groq listening
on: workflow_dispatch
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write GroqStt.kt
        run: |
          cat > app/src/main/java/com/nova/assistant/GroqStt.kt <<'KT'
          package com.nova.assistant

          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.UnknownHostException

          /**
           * Optional Groq Whisper listening. Used ONLY when the user typed a Groq key in Settings.
           * The key goes only into the Authorization header and is never logged.
           * The returned text is untrusted: it can start a normal command, but it can never approve anything.
           */
          object GroqStt {
              private const val ENDPOINT = "https://api.groq.com/openai/v1/audio/transcriptions"
              private const val MODEL = "whisper-large-v3"
              private const val PROMPT = "Nova, torch chalu karo. Instagram kholo. Volume kam karo."
              private const val RATE = 16000

              class Res(val code: Int, val text: String?)

              fun failText(code: Int): String = when (code) {
                  598, 599 -> "internet"
                  401, 403 -> "key galat"
                  429 -> "limit"
                  else -> "error $code"
              }

              private fun wav(pcm: ByteArray): ByteArray {
                  val out = ByteArrayOutputStream()
                  fun i32(v: Int) {
                      out.write(v and 0xff); out.write((v shr 8) and 0xff)
                      out.write((v shr 16) and 0xff); out.write((v shr 24) and 0xff)
                  }
                  fun i16(v: Int) { out.write(v and 0xff); out.write((v shr 8) and 0xff) }
                  out.write("RIFF".toByteArray()); i32(36 + pcm.size); out.write("WAVE".toByteArray())
                  out.write("fmt ".toByteArray()); i32(16); i16(1); i16(1); i32(RATE); i32(RATE * 2); i16(2); i16(16)
                  out.write("data".toByteArray()); i32(pcm.size); out.write(pcm)
                  return out.toByteArray()
              }

              fun transcribe(key: String, pcm: ByteArray): Res {
                  if (key.isBlank() || pcm.size < 3200) return Res(0, null)
                  val boundary = "novaform" + System.currentTimeMillis()
                  val body = ByteArrayOutputStream()
                  fun field(name: String, value: String) {
                      body.write(("--" + boundary + "\r\nContent-Disposition: form-data; name=\"" + name + "\"\r\n\r\n" + value + "\r\n").toByteArray(Charsets.UTF_8))
                  }
                  field("model", MODEL)
                  field("response_format", "json")
                  field("temperature", "0")
                  field("prompt", PROMPT)
                  body.write(("--" + boundary + "\r\nContent-Disposition: form-data; name=\"file\"; filename=\"cmd.wav\"\r\nContent-Type: audio/wav\r\n\r\n").toByteArray(Charsets.UTF_8))
                  body.write(wav(pcm))
                  body.write(("\r\n--" + boundary + "--\r\n").toByteArray(Charsets.UTF_8))
                  var conn: HttpURLConnection? = null
                  return try {
                      val c = URL(ENDPOINT).openConnection() as HttpURLConnection
                      conn = c
                      c.requestMethod = "POST"
                      c.connectTimeout = 8000
                      c.readTimeout = 20000
                      c.doOutput = true
                      c.setRequestProperty("Authorization", "Bearer " + key)
                      c.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + boundary)
                      c.outputStream.use { it.write(body.toByteArray()) }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) Res(code, null)
                      else Res(code, JSONObject(text).optString("text", "").trim())
                  } catch (e: UnknownHostException) {
                      Res(598, null)
                  } catch (e: IOException) {
                      Res(599, null)
                  } catch (e: Exception) {
                      Res(1, null)
                  } finally {
                      conn?.disconnect()
                  }
              }
          }
          KT
      - name: Write HindiRoman.kt
        run: |
          cat > app/src/main/java/com/nova/assistant/HindiRoman.kt <<'KT'
          package com.nova.assistant

          /** Turns common Hindi (Devanagari) command words from a cloud listener into the Roman words Logic.classify knows. */
          object HindiRoman {
              private val MAP: Map<String, String> = mapOf(
                  "नोवा" to "nova",
                  "खोलो" to "kholo", "खोलें" to "kholo", "खोलिए" to "kholo", "खोल" to "khol", "ओपन" to "open",
                  "चालू" to "chalu", "चालु" to "chalu", "शुरू" to "chalu", "चलाओ" to "chalao",
                  "बंद" to "band", "बन्द" to "band",
                  "करो" to "karo", "कर" to "kar", "दो" to "do", "कीजिए" to "karo", "करें" to "karo",
                  "टॉर्च" to "torch", "टार्च" to "torch", "टोर्च" to "torch", "फ्लैशलाइट" to "flashlight",
                  "वॉल्यूम" to "volume", "वोल्यूम" to "volume", "वॉल्युम" to "volume",
                  "आवाज़" to "awaaz", "आवाज" to "awaaz",
                  "कम" to "kam", "घटाओ" to "kam",
                  "बढ़ाओ" to "badhao", "बढाओ" to "badhao", "बढ़ा" to "badhao",
                  "ज़्यादा" to "badhao", "ज्यादा" to "badhao", "तेज़" to "badhao", "तेज" to "badhao",
                  "बैटरी" to "battery", "ब्राइटनेस" to "brightness", "चार्जिंग" to "charging",
                  "इंस्टाग्राम" to "instagram", "व्हाट्सएप" to "whatsapp", "व्हाट्सऐप" to "whatsapp",
                  "वॉट्सएप" to "whatsapp", "यूट्यूब" to "youtube", "क्रोम" to "chrome", "कैमरा" to "camera",
                  "गूगल" to "google", "मैप्स" to "maps", "टेलीग्राम" to "telegram", "फेसबुक" to "facebook",
                  "सेटिंग" to "settings", "सेटिंग्स" to "settings",
                  "वाईफाई" to "wifi", "वाई-फाई" to "wifi", "ब्लूटूथ" to "bluetooth",
                  "होम" to "home", "बैक" to "back", "वापस" to "back", "रीसेंट" to "recent",
                  "नोटिफिकेशन" to "notifications", "लॉक" to "lock",
                  "गाना" to "gana", "अगला" to "agla", "पिछला" to "pichla",
                  "रोको" to "ruko", "रुको" to "ruko", "चुप" to "chup",
                  "समय" to "samay", "तारीख" to "tarikh", "कितने" to "kitne", "बजे" to "baje",
                  "स्क्रीन" to "screen", "देखो" to "dekho",
                  "ऑन" to "on", "ऑफ" to "off", "म्यूट" to "mute", "फुल" to "full", "मैक्स" to "max",
                  "प्लीज" to "please", "प्ले" to "play", "पॉज" to "pause", "म्यूजिक" to "music",
                  "संगीत" to "music", "नेक्स्ट" to "next", "सॉन्ग" to "song"
              )

              fun toRoman(s: String): String {
                  val tokens = s.split(Regex("[\\s,।.?!]+")).filter { it.isNotBlank() }
                  return tokens.joinToString(" ") { MAP[it] ?: it }
              }
          }
          KT
      - name: Patch SecureStore, MainActivity, NovaService
        run: |
          python3 - <<'PY'
          base = 'app/src/main/java/com/nova/assistant/'

          def patch(path, old, new):
              s = open(path, encoding='utf-8').read()
              assert s.count(old) == 1, (path, old[:50], s.count(old))
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))

          # ---- SecureStore: separate encrypted slot for the Groq key
          OLD = '/** Old versions kept the key as plain text. Encrypt it once and delete the plain copy. */'
          store = r'''/** Separate encrypted slot for the optional Groq key (voice listening). Never logged, never shown. */
              fun saveGroq(ctx: Context, key: String): Boolean = try {
                  val c = Cipher.getInstance("AES/GCM/NoPadding")
                  c.init(Cipher.ENCRYPT_MODE, secretKey())
                  val ct = c.doFinal(key.trim().toByteArray(Charsets.UTF_8))
                  val blob = Base64.encodeToString(c.iv + ct, Base64.NO_WRAP)
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString("groq_key", blob).commit()
              } catch (e: Exception) { false }

              fun getGroq(ctx: Context): String = try {
                  val blob = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString("groq_key", null)
                  if (blob.isNullOrEmpty()) "" else {
                      val raw = Base64.decode(blob, Base64.NO_WRAP)
                      val iv = raw.copyOfRange(0, 12)
                      val ct = raw.copyOfRange(12, raw.size)
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, secretKey(), GCMParameterSpec(128, iv))
                      String(c.doFinal(ct), Charsets.UTF_8)
                  }
              } catch (e: Exception) { "" }

              fun hasGroq(ctx: Context): Boolean = getGroq(ctx).isNotEmpty()

              fun clearGroq(ctx: Context) {
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().remove("groq_key").commit()
              }

              '''
          patch(base + 'SecureStore.kt', OLD, store + OLD)

          # ---- MainActivity: bridge functions for the settings page
          OLD = 'fun stopSpeak() { NovaService.instance?.stopSpeaking() }'
          bridge = r'''

                  /** The optional Groq key is only ever written here, never sent back to the page. ok / invalid / fail. */
                  @JavascriptInterface
                  fun saveGroqKey(raw: String): String = try {
                      val k = raw.trim()
                      if (k.length < 20 || k.length > 200 || k.any { it.isWhitespace() }) "invalid"
                      else if (SecureStore.saveGroq(this@MainActivity, k)) "ok"
                      else "fail"
                  } catch (e: Exception) { "fail" }

                  @JavascriptInterface
                  fun hasGroqKey(): Boolean = SecureStore.hasGroq(this@MainActivity)

                  @JavascriptInterface
                  fun clearGroqKey() { SecureStore.clearGroq(this@MainActivity) }'''
          patch(base + 'MainActivity.kt', OLD, OLD + bridge)

          OLD = '.put("keyCount", keyCount)'
          patch(base + 'MainActivity.kt', OLD,
                OLD + '\n                .put("hasGroq", SecureStore.hasGroq(this@MainActivity))')

          # ---- NovaService: use Groq listening when a Groq key exists
          OLD = 'val c: Logic.Cmd? = c0 ?: sk?.let { skillCmd(it) }'
          new = r'''var c: Logic.Cmd? = c0 ?: sk?.let { skillCmd(it) }
                  var groqText = ""
                  if (c == null && pcm.isNotEmpty() && SecureStore.hasGroq(this)) {
                      groqText = groqHear(pcm)
                      if (groqText.isNotBlank()) c = Logic.classify(groqText)
                  }'''
          patch(base + 'NovaService.kt', OLD, new)

          OLD = 'return askCloud(pcm, text)'
          patch(base + 'NovaService.kt', OLD,
                'return askCloud(pcm, if (groqText.isNotBlank()) groqText else text)')

          OLD = 'if (Logic.isJunk(text)) {'
          patch(base + 'NovaService.kt', OLD,
                'if (groqText.isBlank() && Logic.isJunk(text)) {')

          OLD = '/** Registers a dangerous action (call, WhatsApp send). It only runs after a spoken, local "yes". */'
          fn = r'''/** Optional Groq Whisper listening (only when the user added a Groq key). Worker thread. The text can start a normal command, never approve one. */
              private fun groqHear(pcm: ByteArray): String {
                  val key = SecureStore.getGroq(this)
                  if (key.isBlank()) return ""
                  val r = GroqStt.transcribe(key, pcm)
                  val raw = r.text
                  if (raw == null) {
                      listener?.invoke("sys", tr(
                          "Groq se sunna nahi ho paya (" + GroqStt.failText(r.code) + ")",
                          "Groq could not listen (" + GroqStt.failText(r.code) + ")"
                      ))
                      return ""
                  }
                  if (raw.isBlank()) return ""
                  listener?.invoke("sys", "Groq: \"" + raw + "\"")
                  return Logic.stripWake(HindiRoman.toRoman(raw).lowercase())
              }

              '''
          patch(base + 'NovaService.kt', OLD, fn + OLD)
          PY
      - name: Commit
        run: |
          git config user.name "nova-bot"
          git config user.email "nova-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add optional Groq Whisper listening (backend)"
          git push
