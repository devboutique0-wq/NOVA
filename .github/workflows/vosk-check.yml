name: Vosk model check
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Download and list
        run: |
          curl -L --retry 3 -f -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          ls -l m.zip
          unzip -l m.zip | head -60
          echo "=== words/final files ==="
          unzip -l m.zip | grep -i "words.txt\|final.mdl" || echo "NOT FOUND"
