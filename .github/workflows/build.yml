name: Build and Test APK

# Runs on every push / pull request. You can also start it by hand (Run workflow) from the phone.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Runs BEFORE the model download so the big binary model is never scanned.
      - name: Secret scan (source tree)
        run: |
          set -euo pipefail
          # Google API keys, PEM private keys, generic "sk-" style tokens
          if grep -rEn --exclude-dir=.git --exclude-dir=.github \
              -e 'AIza[0-9A-Za-z_-]{35}' \
              -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              -e 'sk-[A-Za-z0-9]{32,}' . ; then
            echo "::error::Possible secret found in the source tree (see lines above)"
            exit 1
          fi
          echo "No secrets found"

      - name: Forbidden permissions / patterns
        run: |
          set -euo pipefail
          M=app/src/main/AndroidManifest.xml
          for p in QUERY_ALL_PACKAGES SYSTEM_ALERT_WINDOW CALL_PHONE; do
            if grep -q "$p" "$M"; then echo "::error::$p must not be in the manifest"; exit 1; fi
          done
          if grep -rEn 'catch \(_' app/src/main/java; then
            echo "::error::catch (_ ...) is not valid Kotlin 1.9"; exit 1
          fi
          if grep -rn '!!' app/src/main/java; then
            echo "::error::unsafe !! operator found"; exit 1
          fi

            - name: Download and validate offline wake/command model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets tmp
          curl -L --retry 3 --retry-all-errors -f -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip -d tmp
          echo "---- extracted files ----"
          find tmp -maxdepth 3 | head -60
          MD=$(find tmp -type f -name final.mdl | head -1 | xargs -r dirname | xargs -r dirname)
          echo "model dir: $MD"
          test -n "$MD"
          mv "$MD" app/src/main/assets/model-en
          rm -rf m.zip tmp
          du -sh app/src/main/assets/model-en
          SIZE_MB=$(du -sm app/src/main/assets/model-en | cut -f1)
          echo "model size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -lt 30 ] || [ "$SIZE_MB" -gt 120 ]; then
            echo "::error::Vosk model size ${SIZE_MB} MB is outside the expected 30-120 MB range"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Source sanity checks
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nova/assistant/NovaService.kt
          grep -q 'SecureStore.getKeys' app/src/main/java/com/nova/assistant/NovaService.kt
          grep -q 'gemini-3.5-flash' app/src/main/java/com/nova/assistant/Logic.kt
          grep -q 'android:canRetrieveWindowContent="true"' app/src/main/res/xml/accessibility_config.xml
          test -f app/src/main/assets/ui.html

      - name: Check ui.html script syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          s = open("app/src/main/assets/ui.html", encoding="utf-8").read()
          m = re.search(r"<script>(.*)</script>", s, re.S)
          open("ui_check.js", "w", encoding="utf-8").write(m.group(1))
          PY
          node --check ui_check.js
          rm -f ui_check.js

      # 1) unit tests  2) APK build. If a test fails the APK is not built.
      - name: Test and build
        run: gradle testDebugUnitTest assembleDebug --no-daemon --console=plain

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -l "$APK"
          unzip -l "$APK" > apk_list.txt
          grep -q 'assets/model-en/am/final.mdl' apk_list.txt
          grep -q 'assets/model-en/graph/words.txt' apk_list.txt
          grep -q 'assets/ui.html' apk_list.txt
          grep -q 'classes.dex' apk_list.txt
          # the Vosk native library must be packaged for at least one ABI
          grep -q 'libvosk.so' apk_list.txt
          # no secrets inside the APK's text assets
          mkdir -p apk_x && unzip -q "$APK" 'assets/ui.html' -d apk_x
          if grep -Ein 'AIza[0-9A-Za-z_-]{35}' apk_x/assets/ui.html; then
            echo "::error::API key pattern inside APK"; exit 1
          fi
          rm -rf apk_x apk_list.txt

      - name: Upload test report (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests

      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: app/build/outputs/apk/debug/app-debug.apk
