name: add-ui
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat, typed bridge, manifest, smooth animations
        run: |
          cat > /tmp/p1.py <<'PYEOF'
          import re, sys
          R = sys.argv[1] if len(sys.argv) > 1 else '.'
          def rd(p): return open(R + '/' + p, encoding='utf-8').read()
          def wr(p, s): open(R + '/' + p, 'w', encoding='utf-8').write(s)

          # ---- 1. NovaService.kt: typed chat entry ----
          p = 'app/src/main/java/com/nova/assistant/NovaService.kt'
          s = rd(p)
          if 'fun typed(' not in s:
              a = '    fun stopSpeaking() { try { tts?.stop() } catch (e: Exception) { }; ttsActive = false }\n'
              assert s.count(a) == 1
              s = s.replace(a, a + '''
              /** Typed chat: runs exactly like a spoken command. A typed "yes" never approves a risky action (that needs the spoken yes). */
              fun typed(text: String): String {
                  if (!alive) return "off"
                  if (busy) return "busy"
                  busy = true
                  Thread { process(ByteArray(0), text, 0) }.start()
                  return "sent"
              }
          ''')
              wr(p, s)

          # ---- 2. MainActivity.kt: bridge ----
          p = 'app/src/main/java/com/nova/assistant/MainActivity.kt'
          s = rd(p)
          if 'fun sendText(' not in s:
              a = '        @JavascriptInterface\n        fun stopSpeak() { NovaService.instance?.stopSpeaking() }\n'
              assert s.count(a) == 1
              s = s.replace(a, a + '''
                  @JavascriptInterface
                  fun sendText(t: String): String = NovaService.instance?.typed(t.take(500)) ?: "off"

                  @JavascriptInterface
                  fun wakeNow() { NovaService.instance?.wakeNow() }
          ''')
              wr(p, s)

          # ---- 3. Manifest: WAKE_LOCK + pattern screen (same as add-pattern) ----
          p = 'app/src/main/AndroidManifest.xml'
          s = rd(p)
          if 'PatternSetupActivity' not in s:
              a = '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
              assert s.count(a) == 1
              if 'WAKE_LOCK' not in s:
                  s = s.replace(a, a + '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n')
              b = '        <service\n            android:name=".NovaService"'
              assert s.count(b) == 1
              act = ('        <activity\n            android:name=".PatternSetupActivity"\n            android:exported="true"\n'
                     '            android:label="NOVA Pattern">\n            <intent-filter>\n'
                     '                <action android:name="android.intent.action.MAIN"/>\n'
                     '                <category android:name="android.intent.category.LAUNCHER"/>\n'
                     '            </intent-filter>\n        </activity>\n')
              s = s.replace(b, act + b)
              wr(p, s)

          # ---- 4. ui.html: chat screen + intro failsafe ----
          p = 'app/src/main/assets/ui.html'
          s = rd(p)
          if 'id="chat"' not in s:
              css = '''
          .row{flex-wrap:wrap;justify-content:center}
          #chat{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:radial-gradient(circle at 50% 20%,#0b2147,#050b1c 65%,#02040b);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
          #chat.on{display:flex}
          .chh{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(47,184,255,.25)}
          .chh b{letter-spacing:6px;font-weight:300;font-size:16px;color:var(--c1);text-shadow:0 0 12px var(--c1)}
          #clog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 2px}
          .chi{display:flex;gap:8px;align-items:center;padding-top:8px}
          #c_in{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:1px solid var(--c2);background:rgba(0,0,0,.5);color:#fff;font-size:15px}
          .chi button.icb{flex:0 0 44px;width:44px;height:44px;border-radius:22px}
          '''
              a = '</style></head>'
              assert s.count(a) == 1
              s = s.replace(a, css + a)

              a = '<button class="sm" id="gear">SETTINGS</button>'
              assert s.count(a) == 1
              s = s.replace(a, '<button class="sm" id="chatb">CHAT</button>' + a)

              html = '''<div id="chat"><div class="chh"><b>NOVA CHAT</b><button class="sm" id="c_close">BAND KARO</button></div>
          <div id="clog"></div>
          <div class="chi"><input id="c_in" type="text" placeholder="NOVA se kuch bhi likho..." autocomplete="off" enterkeyhint="send">
          <button class="icb" id="c_mic" aria-label="mic"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM6 11a6 6 0 0012 0M12 17v4"/></svg></button>
          <button class="icb" id="c_send" aria-label="send"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg></button></div></div>
          '''
              a = '<div id="sheet">'
              assert s.count(a) == 1
              s = s.replace(a, html + a)

              js = r'''<script>
          /* chat screen + intro failsafe */
          (function(){
          function g(i){return document.getElementById(i)}
          var chat=g('chat'),cl=g('clog'),ci=g('c_in'),skipMe=0;
          function cadd(t,c){var d=document.createElement('div');d.className='msg '+c;d.textContent=t;cl.appendChild(d);cl.scrollTop=cl.scrollHeight}
          function openChat(){chat.classList.add('on');if(!cl.children.length)cadd('Main NOVA hoon. Neeche likho ya mic dabao. (Chat ke liye pehle ACTIVATE dabana hai.)','ai');setTimeout(function(){ci.focus()},150)}
          function closeChat(){chat.classList.remove('on');ci.blur()}
          function send(){
            var t=ci.value.trim();if(!t)return;var r='off';
            try{r=Android.sendText(t)}catch(e){}
            if(r==='sent'){ci.value='';cadd(t,'me');try{add(t,'me')}catch(e){}skipMe++}
            else if(r==='busy'){cadd('NOVA abhi kaam kar raha hai, thoda ruko','ai')}
            else{cadd('NOVA abhi band hai. Pehle home screen par ACTIVATE dabao, phir yahan likho.','ai')}
          }
          g('chatb').onclick=openChat;g('c_close').onclick=closeChat;g('c_send').onclick=send;
          ci.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send()}});
          g('c_mic').onclick=function(){
            var run=false;try{run=Android.running()}catch(e){}
            if(!run){var r='';try{r=Android.toggle()}catch(e){}
              if(r==='started'){try{setOn(true)}catch(e){}cadd('NOVA chalu ho gaya. Ab "'+((window.S&&S.wake)||'nova')+'" bolo ya dobara mic dabao.','ai')}
              else if(r==='perm'||r==='nomic'){cadd('Mic permission chahiye. Allow dabao ya Settings > Apps > NOVA se allow karo.','ai')}
              return}
            try{Android.wakeNow()}catch(e){}cadd('Sun raha hu... bolo','ai')
          };
          var _on=window.onNova;
          window.onNova=function(r,t){
            if(r==='me'&&skipMe>0){skipMe--;return}
            if(r==='me'||r==='ai')cadd(t,r);
            if(_on)_on(r,t)
          };
          var _nb=window.novaBack;
          window.novaBack=function(){if(chat.classList.contains('on')){closeChat();return 'handled'}return _nb?_nb():'exit'};
          /* if the opening animation ever stalls, never leave the screen covered */
          setTimeout(function(){try{var i=g('intro');if(i&&i.classList.contains('on')){i.classList.remove('on');i.style.opacity=''}document.body.classList.add('ready')}catch(e){}},9000);
          })();
          </script>'''
              a = '</script></body></html>'
              assert s.count(a) == 1
              s = s.replace(a, '</script>' + js + '</body></html>')
              wr(p, s)
          print('patched ok')
          PYEOF
          cat > /tmp/p2.py <<'PYEOF'
          import sys
          R = sys.argv[1] if len(sys.argv) > 1 else '.'
          def rd(p): return open(R + '/' + p, encoding='utf-8').read()
          def wr(p, s): open(R + '/' + p, 'w', encoding='utf-8').write(s)

          # ---- MainActivity.kt: ask Android for the highest screen refresh rate (90/120 Hz phones) ----
          p = 'app/src/main/java/com/nova/assistant/MainActivity.kt'
          s = rd(p)
          if 'fun boostRefresh(' not in s:
              a = '        setContentView(web)\n'
              assert s.count(a) == 1
              s = s.replace(a, a + '        boostRefresh()\n')
              b = '    private fun blocked() ='
              assert s.count(b) == 1
              s = s.replace(b, '''    /** Smoothness: use the phone's highest refresh rate (90/120 Hz) while NOVA is on screen. */
              @Suppress("DEPRECATION")
              private fun boostRefresh() {
                  try {
                      val modes = windowManager.defaultDisplay.supportedModes
                      var best: android.view.Display.Mode? = null
                      for (m in modes) { if (best == null || m.refreshRate > best.refreshRate) best = m }
                      if (best != null) {
                          val lp = window.attributes
                          lp.preferredDisplayModeId = best.modeId
                          window.attributes = lp
                      }
                  } catch (e: Throwable) {
                  }
              }

          ''' + b)
              wr(p, s)

          # ---- ui.html: smoother, richer animations + automatic quality governor ----
          p = 'app/src/main/assets/ui.html'
          s = rd(p)
          if 'id="smooth-fx"' not in s:
              css = '''/* smooth-fx */
          html{overscroll-behavior:none}
          *{-webkit-user-select:none;user-select:none}
          input,textarea{-webkit-user-select:text;user-select:text}
          button,.f{touch-action:manipulation;transition:transform .24s cubic-bezier(.34,1.56,.64,1),background .2s,opacity .2s}
          button:active,.f:active{transform:scale(.93)}
          button:not(#btn){position:relative;overflow:hidden}
          .rp{position:absolute;border-radius:50%;pointer-events:none;background:rgba(0,240,255,.38);transform:translate(-50%,-50%) scale(0);animation:rpl .62s cubic-bezier(.2,.7,.3,1) forwards}
          @keyframes rpl{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
          #btn{position:relative;overflow:visible}
          #btn:after{content:"";position:absolute;inset:-2px;border-radius:40px;border:2px solid var(--c1);opacity:0;pointer-events:none;animation:ping 2.8s cubic-bezier(.2,.6,.3,1) infinite 1.4s}
          .on #btn:after,.listen #btn:after,.think #btn:after{animation-duration:1.7s}
          @keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.16,1.55)}}
          #dot{animation:dotp 2.2s ease-in-out infinite}
          @keyframes dotp{50%{transform:scale(1.55);opacity:.5}}
          .orbbox canvas{animation:orbf 6.5s ease-in-out infinite}
          @keyframes orbf{50%{transform:translateY(-7px)}}
          .msg{animation:msgIn .44s cubic-bezier(.2,.9,.25,1.12) backwards}
          .me{transform-origin:100% 100%}.ai{transform-origin:0 100%}
          @keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
          .ready .f{animation:cardIn .62s cubic-bezier(.2,.9,.25,1.15) backwards}
          @keyframes cardIn{from{opacity:0;transform:translateX(28px) scale(.9)}to{opacity:1;transform:none}}
          #panel>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
          #chat.on{animation:chatIn .4s cubic-bezier(.2,.9,.25,1) both}
          @keyframes chatIn{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
          .feats{scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
          .log,#clog,#panel,#uc{scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
          .typing{display:flex;gap:5px;padding:13px 16px;width:66px}
          .typing i{width:7px;height:7px;border-radius:50%;background:var(--c1);animation:tdot 1.1s ease-in-out infinite}
          .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
          @keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
          html.lowfx #btn:after,html.lowfx .orbbox canvas,html.lowfx #dot{animation:none}
          html.lowfx .f{clip-path:none}
          @media (prefers-reduced-motion:reduce){#btn:after,.orbbox canvas,#dot,.typing i{animation:none}}
          '''
              a = '</style></head>'
              assert s.count(a) == 1
              s = s.replace(a, css + a)

              js = r'''<script id="smooth-fx">
          (function(){
          var LOW=false;
          /* 1. quality governor: if the phone cannot hold ~40 fps, glow (shadowBlur) is switched off automatically; it comes back when the phone keeps up again */
          ['gl','fx'].forEach(function(id){try{
            var cv=document.getElementById(id),c=cv&&cv.getContext&&cv.getContext('2d');if(!c)return;
            var d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'shadowBlur');
            if(d&&d.set&&d.get)Object.defineProperty(c,'shadowBlur',{configurable:true,get:function(){return d.get.call(c)},set:function(v){d.set.call(c,LOW?0:v)}});
          }catch(e){}});
          var last=0,ema=16.7,bad=0,good=0,H=document.documentElement;
          function tick(t){requestAnimationFrame(tick);
            if(document.hidden){last=0;return}
            if(last){var dt=t-last;if(dt<250)ema=ema*.92+dt*.08}
            last=t;
            if(!LOW){if(ema>26){if(++bad>90){LOW=true;good=0;H.classList.add('lowfx')}}else bad=0}
            else{if(ema<19){if(++good>420){LOW=false;bad=0;H.classList.remove('lowfx')}}else good=0}
          }
          requestAnimationFrame(tick);
          /* 2. tap ripple */
          document.addEventListener('pointerdown',function(e){
            try{var el=e.target.closest&&e.target.closest('button:not(#btn),.f');if(!el||LOW)return;
              var r=el.getBoundingClientRect(),z=Math.max(r.width,r.height)*2.3,sp=document.createElement('span');
              sp.className='rp';sp.style.width=sp.style.height=z+'px';sp.style.left=(e.clientX-r.left)+'px';sp.style.top=(e.clientY-r.top)+'px';
              el.appendChild(sp);setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},700)}catch(x){}
          },{passive:true});
          /* 3. typing dots in the chat while NOVA is working on an answer */
          var cl=document.getElementById('clog');
          if(cl&&window.MutationObserver){
            var dots=null,tmo=0;
            var rm=function(){if(dots&&dots.parentNode)dots.parentNode.removeChild(dots);dots=null;clearTimeout(tmo)};
            new MutationObserver(function(ms){ms.forEach(function(m){Array.prototype.forEach.call(m.addedNodes,function(n){
              if(n===dots||!n.classList||!n.classList.contains('msg'))return;
              if(n.classList.contains('ai')){rm()}
              else if(n.classList.contains('me')){rm();dots=document.createElement('div');dots.className='msg ai typing';dots.innerHTML='<i></i><i></i><i></i>';cl.appendChild(dots);cl.scrollTop=cl.scrollHeight;tmo=setTimeout(rm,40000)}
            })})}).observe(cl,{childList:true});
          }
          })();
          </script>'''
              a = '</body></html>'
              assert s.count(a) == 1
              s = s.replace(a, js + a)
              wr(p, s)
          print('smooth ok')
          PYEOF
          python3 /tmp/p1.py .
          python3 /tmp/p2.py .
      - name: Commit
        run: |
          git config user.name "nova-bot"
          git config user.email "bot@example.com"
          git add -A
          git diff --cached --quiet || git commit -m "UI: chat screen, smoother animations, 120Hz, intro failsafe, pattern screen entry"
          git push
