name: Unpack zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          set -e
          mkdir /tmp/x
          unzip -q NOVA_v15_assistant.zip -d /tmp/x
          rm -rf /tmp/x/.github
          cp -a /tmp/x/. .
          rm -f NOVA_v15_assistant.zip
      - name: Commit
        run: |
          git config user.name "nova-bot"
          git config user.email "nova-bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack NOVA v15" || echo "nothing to commit"
          git push
